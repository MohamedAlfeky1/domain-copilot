version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: domain_copilot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: domain_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domain_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain_copilot_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      ASSIGNED_DOMAIN: ${ASSIGNED_DOMAIN:-D0_HEALTHCARE}
      ASSIGNED_TWIST: ${ASSIGNED_TWIST:-T1_BILINGUAL_AR_EN}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/domain_copilot
      USE_EMBEDDED_DB: "false"
      JWT_SECRET: ${JWT_SECRET:-domain-copilot-assessment-secure-jwt-key-32-chars}
      INGESTION_STAGING_DIR: /data/staging
    volumes:
      - ingestion_staging:/data

volumes:
  pgdata:
  ingestion_staging:
